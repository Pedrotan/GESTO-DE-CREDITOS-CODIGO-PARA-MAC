services:
  # -------------------------------------------------------------------
  # 1. Base de Dados PostgreSQL Local no VPS (com persistência de dados)
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: tango_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-tango_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ficheiro .env}
      POSTGRES_DB: ${DB_NAME:-tangodb}
    volumes:
      - tango_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-vps.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tango_user} -d ${DB_NAME:-tangodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tango_network

  # -------------------------------------------------------------------
  # 2. Servidor Web & API Central Tango ERP
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tango_erp_app
    restart: always
    ports:
      # Só o nginx (HTTPS) chega à aplicação: a porta 3000 não fica exposta à Internet em HTTP.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Instaladores das versões (uma pasta por versão, com latest.yml), copiados para a VPS antes de registar.
      - TANGO_UPDATES_DIR=/app/dados-actualizacoes
      - DATABASE_URL=postgresql://${DB_USER:-tango_user}:${DB_PASSWORD:?Defina DB_PASSWORD no ficheiro .env}@db:5432/${DB_NAME:-tangodb}
      - TANGO_SYNC_SECRET=${TANGO_SYNC_SECRET:-}
      - TANGO_MASTER_SECRET=${TANGO_MASTER_SECRET:?Defina TANGO_MASTER_SECRET no ficheiro .env}
      - TANGO_ALLOWED_ORIGINS=${TANGO_ALLOWED_ORIGINS:-https://tango-gestao-creditos.vercel.app,https://tangogestaoecreditos.tech}
      - TANGO_MASTERGEN_URL=${TANGO_MASTERGEN_URL:-http://tangogestaoecreditos.tech}
      - VERCEL_CLOUD_URL=${VERCEL_CLOUD_URL:-https://tango-gestao-creditos.vercel.app}
      - VPS_IP_URL=${VPS_IP_URL:-http://191.215.45.104}
      - TANGO_LICENSE_SIGNING_KEY=${TANGO_LICENSE_SIGNING_KEY:-}
      - VPS_DOMAIN_URL=${VPS_DOMAIN_URL:-http://tangogestaoecreditos.tech}
      # E-mail (verificação do e-mail das empresas). Desligado até MAIL_ENABLED=true no .env da VPS.
      - APP_URL=${APP_URL:-https://tangogestaoecreditos.tech}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-starttls}
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./vercel-api:/app/vercel-api:ro
      # Só leitura: o servidor nunca altera os instaladores; são copiados por SSH para /var/www/tango-erp/dados-actualizacoes.
      - ./dados-actualizacoes:/app/dados-actualizacoes:ro
      # O site (vercel-web) NÃO é montado da VPS: vem sempre do build da imagem. Montar a pasta do servidor
      # escondia o site acabado de gerar e servia uma versão antiga (ex.: preload antigo, erro de versão da BD local).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tango_network

volumes:
  tango_pgdata:
    name: tango_pgdata

networks:
  tango_network:
    name: tango_network
