# =====================================================================
# Tango Gestão e Créditos ERP - Configuração Nginx para VPS Hostinger
# Colocar em: /etc/nginx/sites-available/tango-erp
# Ativar com: ln -s /etc/nginx/sites-available/tango-erp /etc/nginx/sites-enabled/
# =====================================================================

# Redirecionamento HTTP para HTTPS (gerado automaticamente pelo Certbot, ou manual)
server {
    listen 80;
    listen [::]:80;
    server_name erp.seudominio.com; # Substitua pelo seu domínio ou IP

    # Endpoint para verificação de certificado Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS Seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.seudominio.com; # Substitua pelo seu domínio

    # Certificados SSL (Certbot configurará estes caminhos automaticamente)
    ssl_certificate /etc/letsencrypt/live/erp.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.seudominio.com/privkey.pem;

    # Protocolos SSL e Cifras Modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Limite de Upload (importação de ficheiros e backups)
    client_max_body_size 50M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # Proxy para a Aplicação Node.js (Porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Suporte para WebSockets e conexões persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeçalhos do Cliente Real para Auditoria e Rate Limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para operações de sincronização grandes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}
