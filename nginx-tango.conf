# =====================================================================
# Tango Gestão e Créditos ERP - Configuração Nginx para Hostinger VPS
# Domínio: tangogestaoecreditos.tech
#
# Só HTTPS: qualquer pedido em HTTP (domínio ou IP) é redireccionado para https://tangogestaoecreditos.tech.
# Certificado: sudo certbot certonly --nginx -d tangogestaoecreditos.tech -d www.tangogestaoecreditos.tech
# A aplicação (Docker) escuta apenas em 127.0.0.1:3000; só este nginx lhe chega.
# =====================================================================

# HTTP (porta 80), incluindo o acesso pelo IP: redirecciona tudo para o domínio em HTTPS.
# 308 mantém o método (um POST continua POST), ao contrário de 301.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Renovação automática do certificado (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://tangogestaoecreditos.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tangogestaoecreditos.tech www.tangogestaoecreditos.tech;

    ssl_certificate     /etc/letsencrypt/live/tangogestaoecreditos.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangogestaoecreditos.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Limite de Upload para relatórios e backups
    client_max_body_size 50M;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # Avisos de actualização em tempo real (SSE): ligação longa, sem buffer.
    location = /api/updates/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Encaminhamento para o container Docker (só em 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Cabeçalhos do cliente. Substituídos (não acrescentados): o cliente não consegue falsificar o seu IP,
        # usado nos limites de pedidos e nos bloqueios por tentativas falhadas.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
